name: Director browser checks

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/director-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/director-e2e.yml'
  workflow_dispatch:

concurrency:
  group: director-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Include all web changes: shared UI, dependencies and Vite can affect Director.
# Do not require this path-filtered workflow for unrelated backend-only changes.
jobs:
  director:
    name: Director P0 Chrome E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Director browser tests
        run: |
          google-chrome --version || chromium --version
          bun run test:director:e2e
